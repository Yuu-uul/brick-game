<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>打砖块 - 击打加速/收回减速</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2c3e50; /* 保留原有深色背景 */
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            font-family: Arial, sans-serif;
        }
        canvas {
            background-color: #34495e;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            margin-top: 20px;
            border-radius: 5px;
        }
        .controls {
            margin-top: 15px;
            font-size: 16px;
            color: #bdc3c7;
        }
        kbd {
            background-color: #7f8c8d;
            padding: 2px 6px;
            border-radius: 3px;
            color: white;
        }
    </style>
</head>
<body>

    <h2> 动态速度打砖块</h2>
    <div class="controls">
        操作说明：<kbd>←</kbd> <kbd>→</kbd> 移动挡板 | <kbd>空格键</kbd> 发射 / 触发减速收回
    </div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // --- 游戏核心状态 ---
    let isRetracting = false; // 是否处于减速收回状态
    let speedMultiplier = 1;  // 速度乘数（击碎砖块后增加）

    // --- 挡板设置 ---
    const paddle = {
        width: 120,
        height: 15,
        x: (canvas.width - 120) / 2,
        y: canvas.height - 30,
        speed: 8,
        dx: 0
    };

    // --- 弹球设置 ---
    const ball = {
        x: canvas.width / 2,
        y: canvas.height - 50,
        radius: 8,
        baseSpeed: 5, // 基础速度
        dx: 0,
        dy: 0,
        isLaunched: false
    };

    // --- 砖块设置 ---
    const brickRowCount = 5;
    const brickColumnCount = 10;
    const brickWidth = 70;
    const brickHeight = 25;
    const brickPadding = 10;
    const brickOffsetTop = 50;
    const brickOffsetLeft = 35;
    let bricks = [];

    // 初始化砖块
    function initBricks() {
        bricks = [];
        for (let c = 0; c < brickColumnCount; c++) {
            bricks[c] = [];
            for (let r = 0; r < brickRowCount; r++) {
                bricks[c][r] = { x: 0, y: 0, status: 1 };
            }
        }
    }
    initBricks();

    // --- 键盘事件监听 ---
    document.addEventListener('keydown', keyDownHandler);
    document.addEventListener('keyup', keyUpHandler);

    function keyDownHandler(e) {
        if (e.key === 'Right' || e.key === 'ArrowRight') {
            paddle.dx = paddle.speed;
        } else if (e.key === 'Left' || e.key === 'ArrowLeft') {
            paddle.dx = -paddle.speed;
        } else if (e.key === ' ' || e.code === 'Space') {
            e.preventDefault(); // 防止页面滚动
            if (!ball.isLaunched) {
                launchBall(); // 发射弹球
            } else if (ball.isLaunched && !isRetracting) {
                isRetracting = true; // 触发减速收回
            }
        }
    }

    function keyUpHandler(e) {
        if (e.key === 'Right' || e.key === 'ArrowRight' || e.key === 'Left' || e.key === 'ArrowLeft') {
            paddle.dx = 0;
        }
    }

    // 发射弹球
    function launchBall() {
        ball.isLaunched = true;
        let direction = Math.random() > 0.5 ? 1 : -1;
        ball.dx = ball.baseSpeed * direction;
        ball.dy = -ball.baseSpeed;
    }

    // --- 碰撞与物理逻辑 ---
    function collisionDetection() {
        for (let c = 0; c < brickColumnCount; c++) {
            for (let r = 0; r < brickRowCount; r++) {
                let b = bricks[c][r];
                if (b.status === 1) {
                    if (ball.x > b.x && ball.x < b.x + brickWidth && ball.y > b.y && ball.y < b.y + brickHeight) {
                        ball.dy = -ball.dy; // 反弹
                        b.status = 0; // 销毁砖块

                        // 【核心机制】击碎砖块后加速
                        speedMultiplier += 0.05; // 每次增加5%速度
                        
                        // 保持原有运动角度，放大速度向量
                        let currentSpeed = ball.baseSpeed * speedMultiplier;
                        let angle = Math.atan2(ball.dy, ball.dx);
                        ball.dx = currentSpeed * Math.cos(angle);
                        ball.dy = currentSpeed * Math.sin(angle);
                    }
                }
            }
        }
    }

    // --- 绘制函数 ---
    function drawBall() {
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        // 收回时弹球变红提示，正常时为白色
        ctx.fillStyle = isRetracting ? '#e74c3c' : '#ecf0f1'; 
        ctx.fill();
        ctx.closePath();
    }

    function drawPaddle() {
        ctx.beginPath();
        ctx.rect(paddle.x, paddle.y, paddle.width, paddle.height);
        ctx.fillStyle = '#3498db'; // 保留原有蓝色挡板
        ctx.fill();
        ctx.closePath();
    }

    function drawBricks() {
        for (let c = 0; c < brickColumnCount; c++) {
            for (let r = 0; r < brickRowCount; r++) {
                if (bricks[c][r].status === 1) {
                    let brickX = (c * (brickWidth + brickPadding)) + brickOffsetLeft;
                    let brickY = (r * (brickHeight + brickPadding)) + brickOffsetTop;
                    bricks[c][r].x = brickX;
                    bricks[c][r].y = brickY;
                    ctx.beginPath();
                    ctx.rect(brickX, brickY, brickWidth, brickHeight);
                    // 保留原有彩虹色砖块
                    ctx.fillStyle = `hsl(${r * 40}, 70%, 50%)`;
                    ctx.fill();
                    ctx.closePath();
                }
            }
        }
    }

    function drawUI() {
        ctx.font = '16px Arial';
        ctx.fillStyle = '#ecf0f1';
        ctx.fillText(`当前速度倍率: x${speedMultiplier.toFixed(2)}`, 8, 20);
        
        if (isRetracting) {
            ctx.font = 'bold 20px Arial';
            ctx.fillStyle = '#e74c3c';
            ctx.fillText('️ 减速收回中...', canvas.width / 2 - 70, canvas.height / 2);
        }
    }

    // --- 游戏主循环 ---
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        drawBricks();
        drawBall();
        drawPaddle();
        drawUI();
        collisionDetection();

        // 1. 挡板移动逻辑
        if (paddle.x + paddle.dx > 0 && paddle.x + paddle.dx + paddle.width < canvas.width) {
            paddle.x += paddle.dx;
        }

        // 2. 弹球逻辑
        if (ball.isLaunched) {
            // 【核心机制】减速收回逻辑
            if (isRetracting) {
                ball.dy = 2; // 缓慢向下移动
                // 水平方向缓慢向挡板中心靠拢
                let paddleCenter = paddle.x + paddle.width / 2;
                if (ball.x < paddleCenter) ball.dx = 1;
                else if (ball.x > paddleCenter) ball.dx = -1;
                else ball.dx = 0;

                // 判断是否接住（回到挡板区域）
                if (ball.y > paddle.y - ball.radius) {
                    isRetracting = false;
                    ball.isLaunched = false;
                    speedMultiplier = 1; // 收回后重置速度倍率
                    ball.x = paddle.x + paddle.width / 2;
                    ball.y = paddle.y - ball.radius - 1;
                }
            } else {
                // 正常飞行物理碰撞（左右墙壁）
                if (ball.x + ball.dx > canvas.width - ball.radius || ball.x + ball.dx < ball.radius) {
                    ball.dx = -ball.dx;
                }
                // 顶部墙壁
                if (ball.y + ball.dy < ball.radius) {
                    ball.dy = -ball.dy;
                } 
                // 底部（游戏失败）
                else if (ball.y + ball.dy > canvas.height - ball.radius) {
                    alert('游戏结束！');
                    document.location.reload();
                } 
                // 挡板碰撞
                else if (ball.y + ball.dy > paddle.y - ball.radius) {
                    if (ball.x > paddle.x && ball.x < paddle.x + paddle.width) {
                        let hitPoint = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
                        let currentSpeed = Math.sqrt(ball.dx * ball.dx + ball.dy * ball.dy);
                        let angle = hitPoint * (Math.PI / 3); // 最大反弹60度
                        
                        ball.dx = currentSpeed * Math.sin(angle);
                        ball.dy = -currentSpeed * Math.cos(angle);
                    }
                }
            }

            // 更新弹球位置
            ball.x += ball.dx;
            ball.y += ball.dy;

        } else {
            // 弹球未发射时，跟随挡板移动
            ball.x = paddle.x + paddle.width / 2;
            ball.y = paddle.y - ball.radius - 1;
        }

        requestAnimationFrame(draw);
    }

    // 启动游戏
    draw();

</script>
</body>
</html>
