<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打砖块 · Brick Breaker</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(ellipse at top, #1e3a8a 0%, #0f172a 60%, #020617 100%);
    color: #e2e8f0;
    padding: 20px;
    overflow-x: hidden;
  }

  header { text-align: center; margin-bottom: 18px; }

  h1 {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 4px;
    background: linear-gradient(90deg, #60a5fa, #a78bfa, #f472b6);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle {
    margin-top: 6px;
    font-size: 12px;
    color: #64748b;
    letter-spacing: 2px;
  }

  .hud {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 16px;
  }

  .pill {
    background: rgba(30, 41, 59, 0.8);
    border: 1px solid rgba(148, 163, 184, 0.2);
    border-radius: 999px;
    padding: 7px 16px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 7px;
    backdrop-filter: blur(8px);
    transition: all .25s;
  }

  .pill b { color: #fbbf24; font-variant-numeric: tabular-nums; }
  .pill.record { border-color: #f59e0b; box-shadow: 0 0 14px rgba(245,158,11,.45); }

  .stage {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(148,163,184,.15);
  }

  canvas { display: block; background: #0b1220; }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(2, 6, 23, .82);
    backdrop-filter: blur(4px);
    text-align: center;
    padding: 20px;
  }

  .overlay.hidden { display: none; }

  .overlay h2 {
    font-size: 26px;
    letter-spacing: 3px;
    color: #f8fafc;
  }

  .overlay p { font-size: 13px; color: #94a3b8; line-height: 1.9; }

  .btn {
    margin-top: 6px;
    padding: 11px 30px;
    font-size: 15px;
    letter-spacing: 2px;
    color: #0f172a;
    font-weight: 700;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    background: linear-gradient(90deg, #38bdf8, #818cf8);
    transition: transform .15s, box-shadow .15s;
  }

  .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(56,189,248,.35); }

  footer {
    margin-top: 16px;
    font-size: 12px;
    color: #475569;
    text-align: center;
    line-height: 1.9;
  }

  kbd {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 11px;
    color: #cbd5e1;
  }
</style>
</head>
<body>

<header>
  <h1>打砖块</h1>
  <div class="subtitle">BRICK BREAKER · CANVAS</div>
</header>

<div class="hud">
  <div class="pill">🎯 得分 <b id="score">0</b></div>
  <div class="pill">🧱 剩余 <b id="left">0</b></div>
  <div class="pill">💛 关卡 <b id="level">1</b></div>
  <div class="pill">❤️ 生命 <b id="lives">3</b></div>
  <div class="pill" id="bestPill">🏆 最高分 <b id="best">0</b></div>
</div>

<div class="stage">
  <canvas id="game" width="720" height="560"></canvas>

  <div class="overlay" id="overlay">
    <h2 id="ovTitle">准备开始</h2>
    <p id="ovText">移动挡板接住小球，击碎所有砖块。<br>小心别让球掉落，共 3 条生命。</p>
    <button class="btn" id="ovBtn">开始游戏</button>
  </div>
</div>

<footer>
  <kbd>←</kbd> <kbd>→</kbd> 或 <kbd>A</kbd> <kbd>D</kbd> 移动挡板，也可直接移动鼠标<br>
  <kbd>空格</kbd> 发射小球 / 暂停
</footer>

<script>
(() => {
  const cvs = document.getElementById('game');
  const ctx = cvs.getContext('2d');
  const W = cvs.width, H = cvs.height;

  // ---------- 配置 ----------
  const CFG = {
    rows: 6,
    cols: 10,
    brickW: 62,
    brickH: 22,
    gap: 6,
    topOffset: 60,
    ballR: 8,
    paddleW: 110,
    paddleH: 14,
    baseSpeed: 5.2,
    lives: 3
  };

  const PALETTE = [
    ['#f87171', '#dc2626'],
    ['#fb923c', '#ea580c'],
    ['#facc15', '#ca8a04'],
    ['#a3e635', '#65a30d'],
    ['#34d399', '#059669'],
    ['#60a5fa', '#2563eb'],
    ['#a78bfa', '#7c3aed'],
    ['#f472b6', '#db2777']
  ];

  // ---------- 状态 ----------
  let bricks = [], balls = [], particles = [], powerups = [];
  let paddle, score, lives, level, state, best;
  let keys = {};
  let shake = 0;

  best = +(localStorage.getItem('bb_best') || 0);
  document.getElementById('best').textContent = best;

  // ---------- 初始化 ----------
  function reset(full = true) {
    if (full) { score = 0; lives = CFG.lives; level = 1; }
    paddle = { x: W / 2 - CFG.paddleW / 2, w: CFG.paddleW, h: CFG.paddleH, y: H - 40 };
    buildBricks();
    spawnBall();
    particles = [];
    powerups = [];
    sync();
  }

  function buildBricks() {
    bricks = [];
    const totalW = CFG.cols * CFG.brickW + (CFG.cols - 1) * CFG.gap;
    const startX = (W - totalW) / 2;
    const rows = Math.min(CFG.rows + Math.floor((level - 1) / 2), 8);

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < CFG.cols; c++) {
        // 关卡越高，越多硬砖（需多次击打）
        const hard = level > 1 && Math.random() < Math.min(0.08 * level, 0.3);
        bricks.push({
          x: startX + c * (CFG.brickW + CFG.gap),
          y: CFG.topOffset + r * (CFG.brickH + CFG.gap),
          w: CFG.brickW,
          h: CFG.brickH,
          hp: hard ? 2 : 1,
          maxHp: hard ? 2 : 1,
          color: PALETTE[r % PALETTE.length],
          alive: true
        });
      }
    }
  }

  function spawnBall() {
    const speed = CFG.baseSpeed + (level - 1) * 0.6;
    balls = [{
      x: paddle.x + paddle.w / 2,
      y: paddle.y - CFG.ballR - 2,
      vx: speed * (Math.random() > 0.5 ? 1 : -1) * 0.6,
      vy: -speed,
      r: CFG.ballR,
      stuck: true
    }];
  }

  // ---------- 输入 ----------
  addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Space') {
      e.preventDefault();
      if (state === 'play') {
        balls.forEach(b => { if (b.stuck) b.stuck = false; });
        state = 'run';
      } else if (state === 'run') state = 'pause';
      else if (state === 'pause') state = 'run';
    }
  });
  addEventListener('keyup', e => keys[e.code] = false);

  cvs.addEventListener('mousemove', e => {
    const rect = cvs.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (W / rect.width);
    paddle.x = Math.max(0, Math.min(W - paddle.w, x - paddle.w / 2));
  });

  cvs.addEventListener('click', () => {
    if (state === 'play') { balls.forEach(b => b.stuck = false); state = 'run'; }
  });

  document.getElementById('ovBtn').addEventListener('click', () => {
    document.getElementById('overlay').classList.add('hidden');
    reset(true);
    state = 'play';
  });

  // ---------- 逻辑 ----------
  function update() {
    if (state !== 'run' && state !== 'play') return;

    // 键盘移动
    const sp = 9;
    if (keys['ArrowLeft'] || keys['KeyA']) paddle.x -= sp;
    if (keys['ArrowRight'] || keys['KeyD']) paddle.x += sp;
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

    // 粒子
    particles = particles.filter(p => {
      p.x += p.vx; p.y += p.vy; p.vy += 0.18; p.life--;
      return p.life > 0;
    });

    // 道具
    powerups = powerups.filter(p => {
      p.y += 3;
      if (p.y > paddle.y - 10 && p.y < paddle.y + paddle.h + 10 &&
          p.x > paddle.x - 12 && p.x < paddle.x + paddle.w + 12) {
        applyPower(p.type);
        return false;
      }
      return p.y < H;
    });

    if (shake > 0) shake *= 0.85;

    // 小球
    balls.forEach(ball => {
      if (ball.stuck) {
        ball.x = paddle.x + paddle.w / 2;
        ball.y = paddle.y - ball.r - 2;
        return;
      }

      ball.x += ball.vx;
      ball.y += ball.vy;

      // 墙壁
      if (ball.x < ball.r) { ball.x = ball.r; ball.vx *= -1; }
      if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx *= -1; }
      if (ball.y < ball.r) { ball.y = ball.r; ball.vy *= -1; }

      // 挡板
      if (ball.vy > 0 &&
          ball.y + ball.r > paddle.y &&
          ball.y - ball.r < paddle.y + paddle.h &&
          ball.x > paddle.x - ball.r &&
          ball.x < paddle.x + paddle.w + ball.r) {
        const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
        const speed = Math.hypot(ball.vx, ball.vy);
        const angle = hit * (Math.PI / 3);
        ball.vx = speed * Math.sin(angle);
        ball.vy = -speed * Math.cos(angle);
        ball.y = paddle.y - ball.r - 1;
        shake = 4;
      }

      // 砖块
      for (const b of bricks) {
        if (!b.alive) continue;
        if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w &&
            ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h) {
          const overlapX = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r));
          const overlapY = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r));
          if (overlapX < overlapY) ball.vx *= -1; else ball.vy *= -1;

          b.hp--;
          if (b.hp <= 0) {
            b.alive = false;
            score += 10 * level;
            burst(b.x + b.w / 2, b.y + b.h / 2, b.color[0]);
            if (Math.random() < 0.14) dropPower(b.x + b.w / 2, b.y + b.h / 2);
          } else {
            score += 5;
            shake = 3;
          }
          sync();
          break;
        }
      }
    });

    // 掉球
    balls = balls.filter(b => b.y - b.r < H);
    if (balls.length === 0) {
      lives--;
      sync();
      if (lives <= 0) return gameOver();
      paddle.w = CFG.paddleW;
      spawnBall();
      state = 'play';
    }

    // 通关
    if (bricks.every(b => !b.alive)) nextLevel();
  }

  function nextLevel() {
    level++;
    score += 100;
    buildBricks();
    spawnBall();
    state = 'play';
    sync();
  }

  function gameOver() {
    state = 'over';
    if (score > best) {
      best = score;
      localStorage.setItem('bb_best', best);
      document.getElementById('bestPill').classList.add('record');
    }
    document.getElementById('best').textContent = best;
    const ov = document.getElementById('overlay');
    document.getElementById('ovTitle').textContent = '游戏结束';
    document.getElementById('ovText').innerHTML =
      `最终得分 <b style="color:#fbbf24">${score}</b> · 到达第 ${level} 关<br>最高分 ${best}`;
    document.getElementById('ovBtn').textContent = '再来一局';
    ov.classList.remove('hidden');
  }

  function dropPower(x, y) {
    const types = ['wide', 'multi', 'slow'];
    powerups.push({ x, y, type: types[Math.floor(Math.random() * types.length)] });
  }

  function applyPower(type) {
    if (type === 'wide') {
      paddle.w = Math.min(CFG.paddleW * 1.6, 200);
      setTimeout(() => paddle.w = CFG.paddleW, 8000);
    } else if (type === 'multi') {
      const src = balls[0];
      if (src) {
        for (let i = 0; i < 2; i++) {
          balls.push({
            x: src.x, y: src.y, r: src.r, stuck: false,
            vx: src.vx * (i ? -1 : 1) + (Math.random() - 0.5) * 2,
            vy: -Math.abs(src.vy)
          });
        }
      }
    } else if (type === 'slow') {
      balls.forEach(b => { b.vx *= 0.7; b.vy *= 0.7; });
    }
    score += 20;
    sync();
  }

  function burst(x, y, color) {
    for (let i = 0; i < 12; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 6,
        vy: (Math.random() - 0.5) * 6 - 1,
        life: 22 + Math.random() * 12,
        color
      });
    }
    shake = 6;
  }

  function sync() {
    document.getElementById('score').textContent = score;
    document.getElementById('left').textContent = bricks.filter(b => b.alive).length;
    document.getElementById('lives').textContent = lives;
    document.getElementById('level').textContent = level;
  }

  // ---------- 绘制 ----------
  function draw() {
    ctx.save();
    if (shake > 0.3) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    // 背景
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#0f172a');
    bg.addColorStop(1, '#020617');
    ctx.fillStyle = bg;
    ctx.fillRect(-10, -10, W + 20, H + 20);

    // 网格
    ctx.strokeStyle = 'rgba(56, 189, 248, 0.06)';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 40) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += 40) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }

    // 砖块
    bricks.forEach(b => {
      if (!b.alive) return;
      const [c1, c2] = b.color;
      const g = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
      g.addColorStop(0, c1);
      g.addColorStop(1, c2);
      ctx.fillStyle = g;
      roundRect(b.x, b.y, b.w, b.h, 5);
      ctx.fill();

      // 高光
      ctx.fillStyle = 'rgba(255,255,255,0.22)';
      roundRect(b.x + 3, b.y + 3, b.w - 6, 5, 3);
      ctx.fill();

      // 硬砖标记
      if (b.maxHp > 1 && b.hp === 2) {
        ctx.strokeStyle = 'rgba(255,255,255,0.55)';
        ctx.lineWidth = 2;
        roundRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2, 5);
        ctx.stroke();
      }
    });

    // 粒子
    particles.forEach(p => {
      ctx.globalAlpha = Math.max(p.life / 30, 0);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, 4, 4);
    });
    ctx.globalAlpha = 1;

    // 道具
    powerups.forEach(p => {
      const map = { wide: ['#38bdf8', '宽'], multi: ['#f472b6', '多'], slow: ['#a3e635', '慢'] };
      const [color, label] = map[p.type];
      ctx.fillStyle = color;
      roundRect(p.x - 12, p.y - 10, 24, 20, 6);
      ctx.fill();
      ctx.fillStyle = '#0f172a';
      ctx.font = 'bold 12px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, p.x, p.y + 1);
    });

    // 挡板
    const pg = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x, paddle.y + paddle.h);
    pg.addColorStop(0, '#fb923c');
    pg.addColorStop(1, '#ea580c');
    ctx.fillStyle = pg;
    roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    roundRect(paddle.x + 4, paddle.y + 3, paddle.w - 8, 4, 2);
    ctx.fill();

    // 小球
    balls.forEach(b => {
      const sg = ctx.createRadialGradient(b.x - 3, b.y - 3, 1, b.x, b.y, b.r);
      sg.addColorStop(0, '#ffffff');
      sg.addColorStop(1, '#94a3b8');
      ctx.fillStyle = sg;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fill();
    });

    // 提示
    if (state === 'play') {
      ctx.fillStyle = 'rgba(226, 232, 240, 0.75)';
      ctx.font = '15px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('按空格键发射小球', W / 2, H / 2 + 40);
    }
    if (state === 'pause') {
      ctx.fillStyle = 'rgba(2, 6, 23, 0.6)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#f8fafc';
      ctx.font = 'bold 28px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('已暂停', W / 2, H / 2);
      ctx.font = '14px sans-serif';
      ctx.fillStyle = '#94a3b8';
      ctx.fillText('按空格键继续', W / 2, H / 2 + 30);
    }

    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // ---------- 主循环 ----------
  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  reset(true);
  state = 'idle';
  loop();
})();
</script>
</body>
</html>
